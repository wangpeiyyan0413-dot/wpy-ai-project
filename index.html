<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who Are You Without Labels?</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <script>
    let video;
    let poseNet;
    let poses = [];
    let state = 0; 
    let stateStartTime;
    let motionLevel = 0;
    let prevNose = null;
    let currentMislabel = "ANALYZING...";
    let lastLabelChange = 0;

    // 误解阶段的荒谬标签库
    const mislabels = [
      "ABNORMAL MOVEMENT", "THREAT DETECTED", "IRRATIONAL BIOMASS", 
      "UNDEFINED GESTURE", "MALFUNCTION IN SUBJECT", "EMOTION: FATAL ERROR",
      "NON-STANDARD BEHAVIOR", "MEAT_SACK_DETECTED"
    ];

    function setup() {
      createCanvas(windowWidth, windowHeight);
      video = createCapture(VIDEO);
      video.size(640, 480);
      video.hide();
      
      // 初始化 PoseNet，开启镜像翻转
      poseNet = ml5.poseNet(video, { flipHorizontal: true }, modelReady);
      poseNet.on('pose', function(results) {
        poses = results;
      });
      
      textFont('Courier New');
      stateStartTime = millis();
    }

    function modelReady() {
      console.log("Model Loaded");
    }

    function draw() {
      background(0);
      
      // 计算全局时间（秒）以控制五个阶段的演进
      let elapsedTime = (millis() - stateStartTime) / 1000;
      
      // 动作幅度检测 (Motion detection)
      calculateMotion();

      // 状态机流转设置（时间可根据需要调整）
      if (elapsedTime < 5) state = 0;           // 1. 识别：加载中
      else if (elapsedTime < 10) state = 1;      // 1. 识别：检测到人类
      else if (elapsedTime < 25) state = 2;      // 2. 分类：逻辑判定
      else if (elapsedTime < 45) state = 3;      // 3. 误解：荒谬标签
      else if (elapsedTime < 60) state = 4;      // 4. 数据化：肉体剥离，仅剩骨骼
      else state = 5;                            // 5. 结尾：灵魂拷问

      // --- 画面渲染基础设置 ---
      let vW = width;
      let vH = width * (480 / 640);
      if (vH < height) {
        vH = height;
        vW = height * (640 / 480);
      }
      let vX = (width - vW) / 2;
      let vY = (height - vH) / 2;

      // --- 阶段 0, 1, 2, 3: 绘制视频与UI ---
      if (state < 4) {
        push();
        translate(vX, vY);
        scale(vW / 640, vH / 480);
        
        // 黑白滤镜与视频渲染
        drawingContext.filter = 'grayscale(100%) contrast(1.2) brightness(0.8)';
        push();
        translate(640, 0);
        scale(-1, 1);
        image(video, 0, 0, 640, 480);
        pop();
        drawingContext.filter = 'none';

        drawTrackingUI();
        
        if (poses.length > 0) {
          drawSkeleton();
          drawBoundingBox();
        }
        pop();
      }

      // --- 阶段 4: 数据化 (Datafication) ---
      if (state === 4) {
        // 抹除肉体（不画视频），仅保留黑色背景和冰冷的骨架
        push();
        translate(vX, vY);
        scale(vW / 640, vH / 480);
        if (poses.length > 0) {
          drawGlitchSkeleton();
        }
        pop();
        
        // 叠加数字噪点
        fill(255, 50);
        noStroke();
        for(let i=0; i<100; i++){
          rect(random(width), random(height), random(5, 20), 2);
        }
      }

      // --- 文本与标签渲染 ---
      drawLabels();
    }

    // 核心标签逻辑
    function drawLabels() {
      fill(255);
      noStroke();
      textAlign(CENTER, CENTER);

      if (state === 0) {
        textSize(32);
        text("[ ANALYZING... ]", width / 2, height - 50);
      } 
      else if (state === 1) {
        textSize(32);
        text("[ HUMAN DETECTED ]", width / 2, height - 50);
      } 
      else if (state === 2) {
        // 分类阶段：基于真实逻辑判定
        textSize(32);
        let label = "INACTIVE OBJECT";
        if (motionLevel > 15) label = "WARNING: UNSTABLE MOTION";
        if (poses.length > 0) {
          let pose = poses[0].pose;
          // 如果双手举高过鼻子，判定为情绪波动
          if (pose.leftWrist.y < pose.nose.y || pose.rightWrist.y < pose.nose.y) {
            label = "EMOTION DETECTED";
          }
          // 如果靠得太近
          let eyeDist = dist(pose.leftEye.x, pose.leftEye.y, pose.rightEye.x, pose.rightEye.y);
          if (eyeDist > 100) label = "WARNING: DISTANCE TOO CLOSE";
        }
        text(`[ ${label} ]`, width / 2, height - 50);
      } 
      else if (state === 3) {
        // 误解阶段：系统开始随机乱贴标签
        textSize(40);
        if (millis() - lastLabelChange > 1500) { // 每1.5秒换一次荒谬标签
          currentMislabel = random(mislabels);
          lastLabelChange = millis();
        }
        if (motionLevel > 5) {
          fill(255, 0, 0); // 偶尔闪烁警告色（黑白基调中的刺眼红）
        }
        text(`[ ${currentMislabel} ]`, width / 2, height - 50);
      }
      else if (state === 5) {
        // 结尾阶段：灵魂拷问
        background(0); // 完全清空屏幕
        fill(255);
        textSize(48);
        text("Who are you without labels?", width / 2, height / 2);
      }
    }

    // 计算运动幅度
    function calculateMotion() {
      if (poses.length > 0) {
        let nose = poses[0].pose.nose;
        if (prevNose) {
          let d = dist(nose.x, nose.y, prevNose.x, prevNose.y);
          motionLevel = lerp(motionLevel, d, 0.1);
        }
        prevNose = { x: nose.x, y: nose.y };
      } else {
        motionLevel = lerp(motionLevel, 0, 0.1);
      }
    }

    // 绘制高级感 UI 网格与十字线
    function drawTrackingUI() {
      stroke(255, 50);
      strokeWeight(1);
      line(0, 240, 640, 240);
      line(320, 0, 320, 480);
      noFill();
      ellipse(320, 240, 200, 200);
    }

    // 绘制骨骼与关节点
    function drawSkeleton() {
      let pose = poses[0].pose;
      let skeleton = poses[0].skeleton;
      
      stroke(255);
      strokeWeight(2);
      for (let j = 0; j < skeleton.length; j++) {
        let partA = skeleton[j][0];
        let partB = skeleton[j][1];
        line(partA.position.x, partA.position.y, partB.position.x, partB.position.y);
      }
      
      noStroke();
      fill(255);
      for (let i = 0; i < pose.keypoints.length; i++) {
        let x = pose.keypoints[i].position.x;
        let y = pose.keypoints[i].position.y;
        rectMode(CENTER);
        rect(x, y, 6, 6);
      }
    }

    // 数据化阶段的异化骨骼绘制 (像素/面具化)
    function drawGlitchSkeleton() {
      let pose = poses[0].pose;
      let skeleton = poses[0].skeleton;
      
      stroke(255);
      strokeWeight(4);
      for (let j = 0; j < skeleton.length; j++) {
        let partA = skeleton[j][0];
        let partB = skeleton[j][1];
        // 加入随机偏移产生 glitch 感
        let ox = random(-5, 5); 
        line(partA.position.x + ox, partA.position.y, partB.position.x - ox, partB.position.y);
      }
      
      noStroke();
      fill(255);
      for (let i = 0; i < pose.keypoints.length; i++) {
        let x = pose.keypoints[i].position.x;
        let y = pose.keypoints[i].position.y;
        rect(x, y, random(10, 25), random(10, 25)); // 粗糙的像素感方块
      }
      
      // 面具化：在脸部遮盖一个粗糙的几何体
      fill(0);
      stroke(255);
      strokeWeight(2);
      rect(pose.nose.x, pose.nose.y, 80, 100); 
    }

    // 绘制 AI 检测框
    function drawBoundingBox() {
      let pose = poses[0].pose;
      let minX = 640, minY = 480, maxX = 0, maxY = 0;
      
      for (let i = 0; i < pose.keypoints.length; i++) {
        if (pose.keypoints[i].score > 0.2) {
          let x = pose.keypoints[i].position.x;
          let y = pose.keypoints[i].position.y;
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
      }
      
      stroke(255, 150);
      strokeWeight(1);
      noFill();
      rectMode(CORNER);
      rect(minX - 20, minY - 20, (maxX - minX) + 40, (maxY - minY) + 40);
      
      fill(255, 150);
      noStroke();
      textAlign(LEFT, BOTTOM);
      textSize(12);
      text("OBJ_HUMAN_01", minX - 20, minY - 25);
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
