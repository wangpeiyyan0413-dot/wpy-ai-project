<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who are you without labels?</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            /* 黑白、高对比度与低亮度，营造冷酷的艺术感 */
            filter: grayscale(100%) contrast(1.6) brightness(0.7);
            transition: filter 2s ease;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        #status-indicator {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 追踪框 UI */
        #tracking-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40vw;
            height: 60vh;
            border: 1px dashed rgba(255, 255, 255, 0.25);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #fff;
            border-style: solid;
        }
        .top-left { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
        .top-right { top: -2px; right: -2px; border-width: 2px 2px 0 0; }
        .bottom-left { bottom: -2px; left: -2px; border-width: 0 0 2px 2px; }
        .bottom-right { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

        #label-container {
            align-self: flex-start;
            text-shadow: 2px 2px 0 #000;
            max-width: 80%;
        }

        #main-label {
            font-size: 2.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            transition: color 0.2s ease;
        }

        #sub-label {
            font-size: 1.1rem;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        /* 启动按钮 */
        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            padding: 1.2rem 2.5rem;
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.7);
            font-family: 'Space Mono', monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        #start-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        /* 结局画面 */
        #ending-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 5s ease;
        }

        #philosophical-question {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-align: center;
            color: #fff;
            padding: 0 2rem;
            line-height: 1.6;
        }

        /* Glitch 故障效果动画 */
        .glitch-effect {
            animation: glitch-skew 0.25s linear infinite;
            color: #ff3b30 !important;
        }

        @keyframes glitch-skew {
            0% { transform: translate(0, 0) skew(0deg); }
            20% { transform: translate(-4px, 2px) skew(-5deg); }
            40% { transform: translate(3px, -3px) skew(3deg); }
            60% { transform: translate(-3px, -1px) skew(-2deg); }
            80% { transform: translate(4px, 3px) skew(5deg); }
            100% { transform: translate(0, 0) skew(0deg); }
        }
    </style>
</head>
<body>

    <canvas id="gl-canvas"></canvas>
    
    <div id="ui-layer">
        <div class="top-bar">
            <span id="status-indicator">● SYSTEM ACTIVE</span>
            <span id="time-code">00:00:00:00</span>
        </div>
        
        <div id="tracking-box">
            <span class="corner top-left"></span>
            <span class="corner top-right"></span>
            <span class="corner bottom-left"></span>
            <span class="corner bottom-right"></span>
        </div>
        
        <div id="label-container">
            <h1 id="main-label">SYSTEM READY</h1>
            <p id="sub-label">Awaiting human subject to enter the frame.</p>
        </div>
    </div>

    <div id="ending-screen">
        <h1 id="philosophical-question">Who are you without labels?</h1>
    </div>

    <button id="start-btn">INITIALIZE SYSTEM (ACCESS CAMERA)</button>

    <script>
        const canvas = document.getElementById('gl-canvas');
        const ctx = canvas.getContext('2d');
        const video = document.createElement('video');
        
        // 关键修复：允许内联播放及自动播放静音，防止被移动端或 Safari 拦截
        video.setAttribute('playsinline', ''); 
        video.setAttribute('autoplay', '');
        video.muted = true; 

        const startBtn = document.getElementById('start-btn');
        const mainLabel = document.getElementById('main-label');
        const subLabel = document.getElementById('sub-label');
        const trackingBox = document.getElementById('tracking-box');
        const timeCode = document.getElementById('time-code');
        const endingScreen = document.getElementById('ending-screen');
        const uiLayer = document.getElementById('ui-layer');

        let animationId;
        let previousFrame = null;
        let motionLevel = 0;
        let currentState = 0; 
        let stateTimer = 0;

        const STAGE_DURATION = 600; 

        startBtn.addEventListener('click', async () => {
            try {
                startBtn.innerText = "INITIALIZING SYSTEM...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
                
                // 关键修复：捕获播放异常
                try {
                    await video.play();
                } catch (playErr) {
                    console.warn("Video play interrupted or required user interaction.", playErr);
                }
                
                // 关键修复：使用 loadeddata 确保获取到第一帧画面再执行计算
                video.addEventListener('loadeddata', () => {
                    startBtn.style.display = 'none';
                    canvas.width = video.videoWidth || window.innerWidth;
                    canvas.height = video.videoHeight || window.innerHeight;
                    
                    if (currentState === 0) {
                        currentState = 1; 
                        processVideo();
                    }
                });
            } catch (err) {
                startBtn.innerText = "CAMERA ACCESS DENIED";
                alert("System Error: 无法获取摄像头数据。请确保在浏览器设置中授予了摄像头权限，并使用正确的协议（本地测试需 localhost，线上需 HTTPS）。");
                console.error(err);
            }
        });

        setInterval(() => {
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            const ms = String(Math.floor(now.getMilliseconds() / 10)).padStart(2, '0');
            timeCode.innerText = `${hrs}:${mins}:${secs}:${ms}`;
        }, 40);

        function processVideo() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            calculateMotion();
            stateTimer++;
            handleStates();
            animationId = requestAnimationFrame(processVideo);
        }

        function calculateMotion() {
            const sampleW = 64; 
            const sampleH = 64;
            
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = sampleW;
            tempCanvas.height = sampleH;
            
            tempCtx.drawImage(video, 0, 0, sampleW, sampleH);
            const currentFrameData = tempCtx.getImageData(0, 0, sampleW, sampleH).data;
            
            if (previousFrame) {
                let diff = 0;
                for (let i = 0; i < currentFrameData.length; i += 4) {
                    diff += Math.abs(currentFrameData[i] - previousFrame[i]);
                }
                motionLevel = diff / (sampleW * sampleH);
            }
            previousFrame = currentFrameData;
        }

        function handleStates() {
            // Stage 1
            if (currentState === 1) {
                mainLabel.innerText = "HUMAN DETECTED";
                subLabel.innerText = "ANALYZING SKELETON & MOVEMENT... KEEP VISIBLE.";
                trackingBox.style.borderColor = "#fff";
                trackingBox.style.width = "45vw";
                trackingBox.style.height = "65vh";
                
                if (stateTimer > STAGE_DURATION) {
                    currentState = 2;
                    stateTimer = 0;
                }
            }
            // Stage 2
            else if (currentState === 2) {
                if (motionLevel > 35) {
                    mainLabel.innerText = "EMOTION DETECTED";
                    subLabel.innerText = "Subject posture indicates high emotional expression.";
                    trackingBox.style.width = "55vw";
                } else if (motionLevel < 6) {
                    mainLabel.innerText = "INACTIVE OBJECT";
                    subLabel.innerText = "Biological signs low. Potential static hardware.";
                    trackingBox.style.width = "30vw";
                } else {
                    mainLabel.innerText = "NORMAL SUBJECT";
                    subLabel.innerText = "Categorization logic running in background.";
                    trackingBox.style.width = "40vw";
                }
                
                if (stateTimer > STAGE_DURATION) {
                    currentState = 3;
                    stateTimer = 0;
                }
            }
            // Stage 3
            else if (currentState === 3) {
                if (Math.random() > 0.75) {
                    mainLabel.classList.add('glitch-effect');
                } else {
                    mainLabel.classList.remove('glitch-effect');
                }

                if (motionLevel > 25) {
                    mainLabel.innerText = "THREAT DETECTED / ABNORMAL MOVEMENT";
                    subLabel.innerText = "CRITICAL ERROR: Hostile intentions identified.";
                    trackingBox.style.borderColor = "#ff3b30";
                    trackingBox.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 8 - 4}deg) scale(${1 + Math.random()*0.05})`;
                } else {
                    mainLabel.innerText = "BIOMETRIC MISCALCULATED: GAY";
                    subLabel.innerText = "Algorithmic bias encountered. Attempting automated override...";
                }

                if (stateTimer > STAGE_DURATION) {
                    currentState = 4;
                    stateTimer = 0;
                    mainLabel.classList.remove('glitch-effect');
                    trackingBox.style.transform = "translate(-50%, -50%) rotate(0deg) scale(1)";
                }
            }
            // Stage 4
            else if (currentState === 4) {
                mainLabel.innerText = "USER DETECTED";
                subLabel.innerText = "Stripping personal details... Identity quantified.";
                trackingBox.style.display = "none";
                
                const pixelSize = Math.floor(stateTimer / 15) + 4; 
                const w = canvas.width;
                const h = canvas.height;
                
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(canvas, 0, 0, w / pixelSize, h / pixelSize);
                ctx.drawImage(canvas, 0, 0, w / pixelSize, h / pixelSize, 0, 0, w, h);
                
                ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(w / 2, h / 4);  
                ctx.lineTo(w / 2, h / 1.8);
                ctx.lineTo(w / 2.8, h);    
                ctx.moveTo(w / 2, h / 1.8);
                ctx.lineTo(w / 1.5, h);    
                ctx.moveTo(w / 3, h / 2.5); 
                ctx.lineTo(w / 1.5, h / 2.5);
                ctx.stroke();

                if (stateTimer > STAGE_DURATION) {
                    currentState = 5;
                }
            }
            // Stage 5
            else if (currentState === 5) {
                cancelAnimationFrame(animationId);
                uiLayer.style.display = "none";   
                endingScreen.style.opacity = "1";  
            }
        }
    </script>
</body>
</html>
