<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签之外的你 | Who Are You Without Labels</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        
        #video-element { display: none; }
        
        /* 使用两个画布：底层视频/识别层，顶层粒子/UI层 */
        #cv-canvas, #ui-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 禁用鼠标事件，纯靠摄像头手势 */
        }

        #cv-canvas {
            transform: scaleX(-1); /* 镜像翻转，使互动符合直觉 */
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        /* 纯 CSS 结尾画面 */
        #ending-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            z-index: 50;
            transition: opacity 3s ease;
            pointer-events: none;
        }
        #ending-screen h1 { font-size: 40px; font-weight: 300; letter-spacing: 6px; margin-bottom: 20px; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        #ending-screen p { font-size: 18px; color: #888; letter-spacing: 4px; }

        #loading {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 20px; letter-spacing: 4px; color: #fff;
            animation: pulse 1.5s infinite;
            z-index: 100;
        }

        @keyframes pulse {
            0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div id="loading">载入神经计算网络...</div>
    <video id="video-element" autoplay playsinline></video>
    <canvas id="cv-canvas"></canvas>
    <canvas id="ui-canvas"></canvas>

    <div id="ending-screen">
        <h1>褪去标签，你究竟是谁？</h1>
        <p>Who are you without labels?</p>
    </div>

<script>
    const videoElement = document.getElementById('video-element');
    const cvCanvas = document.getElementById('cv-canvas');
    const uiCanvas = document.getElementById('ui-canvas');
    const cvCtx = cvCanvas.getContext('2d');
    const uiCtx = uiCanvas.getContext('2d');
    const loadingUI = document.getElementById('loading');
    const endingScreen = document.getElementById('ending-screen');

    let width, height;
    let currentState = 'INTRO'; // 状态：INTRO, RECOGNITION, CLASSIFICATION, MISUNDERSTANDING, DATAFICATION, ENDING
    let lastPose = null;
    let dataficationProgress = 0;

    // 标签库
    const normalLabels = ["状态：静止", "动作：舒展", "行为：观察", "空间：交互中", "动态：试探"];
    const actionLabels = ["动作：挥舞", "状态：剧烈运动", "行为：打破边界", "姿态：防御"];
    const absurdLabels = [
        "未认证的碳基生物", "试图起飞的打字机", "卡顿的 NPC", 
        "情感模块 Error", "野生奥特曼检测中", "无效的求偶舞蹈",
        "一棵情绪不稳定的树", "正在下载灵魂 404"
    ];
    let currentRandomLabels = [];

    // --- 粒子系统 (黑白高级感) ---
    class Particle {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 1.5;
            this.vy = (Math.random() - 0.5) * 1.5;
            this.size = Math.random() * 2 + 0.5;
            this.baseSize = this.size;
            this.color = `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.1})`;
        }
        update(handX, handY) {
            this.x += this.vx; this.y += this.vy;
            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;

            // 手部引力/斥力互动
            if (handX && handY) {
                let dx = handX - this.x; let dy = handY - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 150) {
                    this.x -= dx * 0.02; // 斥力
                    this.y -= dy * 0.02;
                    this.size = this.baseSize * 3;
                } else {
                    this.size = this.baseSize;
                }
            }
        }
        draw(ctx) {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    let particles = [];
    function initParticles() {
        particles = [];
        for (let i = 0; i < 200; i++) {
            particles.push(new Particle(Math.random() * width, Math.random() * height));
        }
    }

    // --- 跨界面交互按钮 (手势触发) ---
    class Button {
        constructor(x, y, label, targetState) {
            this.x = x; this.y = y; this.r = 45;
            this.label = label;
            this.targetState = targetState;
            this.hoverProgress = 0;
        }
        update(handX, handY) {
            if (currentState === this.targetState) return; // 已激活状态忽略
            
            let dx = handX - this.x; let dy = handY - this.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < this.r + 20) {
                this.hoverProgress += 0.03; // 悬停加载进度
                if (this.hoverProgress >= 1) {
                    currentState = this.targetState; // 触发切换
                    this.hoverProgress = 0;
                    dataficationProgress = 0;
                    if (currentState === 'MISUNDERSTANDING') generateRandomLabels();
                    createRipple(this.x, this.y); // 粒子爆炸反馈
                }
            } else {
                this.hoverProgress = Math.max(0, this.hoverProgress - 0.05);
            }
        }
        draw(ctx) {
            ctx.strokeStyle = currentState === this.targetState ? '#fff' : 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.stroke();

            // 悬停进度条
            if (this.hoverProgress > 0 && currentState !== this.targetState) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, -Math.PI/2, -Math.PI/2 + (Math.PI * 2 * this.hoverProgress));
                ctx.stroke();
            }

            ctx.fillStyle = currentState === this.targetState ? '#fff' : 'rgba(255,255,255,0.7)';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.label, this.x, this.y);
        }
    }

    let buttons = [];
    let ripples = [];

    function initUI() {
        // 在画面边缘创建交互按钮
        buttons = [
            new Button(100, height/2 - 150, "1.识别", "RECOGNITION"),
            new Button(100, height/2, "2.分类", "CLASSIFICATION"),
            new Button(100, height/2 + 150, "3.误解", "MISUNDERSTANDING"),
            new Button(width - 100, height/2 - 75, "4.数据化", "DATAFICATION"),
            new Button(width - 100, height/2 + 75, "5.结尾", "ENDING")
        ];
    }

    function createRipple(x, y) {
        ripples.push({x, y, r: 0, alpha: 1});
    }

    function generateRandomLabels() {
        currentRandomLabels = [];
        for(let i=0; i<4; i++){
            currentRandomLabels.push({
                text: absurdLabels[Math.floor(Math.random() * absurdLabels.length)],
                node: Math.floor(Math.random() * 25)
            });
        }
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        cvCanvas.width = width; cvCanvas.height = height;
        uiCanvas.width = width; uiCanvas.height = height;
        initParticles();
        initUI();
    }
    window.addEventListener('resize', resize);
    resize();

    // --- 核心绘制逻辑 ---
    function onResults(results) {
        if(loadingUI.style.display !== 'none') {
            loadingUI.style.display = 'none';
            cvCanvas.style.opacity = 1; // 淡入摄像头
            currentState = 'RECOGNITION';
        }

        // 1. 底层视觉处理 (彩色视频 + 色彩追踪)
        cvCtx.save();
        cvCtx.clearRect(0, 0, width, height);

        // 数据化阶段逐渐让肉体消失 (半透明黑覆盖)
        if (currentState === 'DATAFICATION') {
            dataficationProgress = Math.min(1, dataficationProgress + 0.005);
            cvCtx.globalAlpha = 1 - dataficationProgress;
        }

        if (currentState !== 'ENDING') {
            cvCtx.drawImage(results.image, 0, 0, width, height);
        }
        cvCtx.restore();

        // 2. 顶层 UI/粒子处理
        uiCtx.clearRect(0, 0, width, height);

        // 获取食指用于交互 (优先右手，其次左手)
        let indexTip = null;
        let handX = null, handY = null;
        if (results.rightHandLandmarks) { indexTip = results.rightHandLandmarks[8]; }
        else if (results.leftHandLandmarks) { indexTip = results.leftHandLandmarks[8]; }
        
        if (indexTip) {
            // 注意：因为底层视频 scaleX(-1) 翻转了，手势坐标也需要反转以映射到屏幕
            handX = (1 - indexTip.x) * width; 
            handY = indexTip.y * height;
            
            // 绘制手势光标
            uiCtx.beginPath();
            uiCtx.arc(handX, handY, 8, 0, Math.PI * 2);
            uiCtx.fillStyle = '#fff';
            uiCtx.fill();
            uiCtx.shadowBlur = 15; uiCtx.shadowColor = "#fff";
            uiCtx.shadowBlur = 0;
        }

        // 绘制并更新粒子
        particles.forEach(p => { p.update(handX, handY); p.draw(uiCtx); });

        // 绘制涟漪特效
        ripples.forEach((r, i) => {
            r.r += 8; r.alpha -= 0.02;
            uiCtx.beginPath(); uiCtx.arc(r.x, r.y, r.r, 0, Math.PI*2);
            uiCtx.strokeStyle = `rgba(255, 255, 255, ${r.alpha})`;
            uiCtx.lineWidth = 2; uiCtx.stroke();
            if(r.alpha <= 0) ripples.splice(i, 1);
        });

        // 更新与绘制按钮
        if (currentState !== 'ENDING') {
            buttons.forEach(btn => {
                if (handX && handY) btn.update(handX, handY);
                btn.draw(uiCtx);
            });
        }

        // --- 业务逻辑：艺术阶段表现 ---
        if (results.poseLandmarks && currentState !== 'INTRO' && currentState !== 'ENDING') {
            const pose = results.poseLandmarks;
            
            // 阶段 1：识别 (彩色科幻感)
            if (currentState === 'RECOGNITION') {
                drawSkeletalTracking(uiCtx, pose, '#00ffff'); // 青色识别
                drawLabel(uiCtx, "ANALYZING...", (1 - pose[0].x) * width, pose[0].y * height - 80, '#00ffff');
                drawLabel(uiCtx, "[ HUMAN DETECTED ]", width/2, height - 50, '#00ffff', 24);
            }
            
            // 阶段 2：分类 (逻辑贴图)
            if (currentState === 'CLASSIFICATION') {
                let speed = 0;
                if (lastPose) {
                    let dx = pose[0].x - lastPose[0].x; let dy = pose[0].y - lastPose[0].y;
                    speed = Math.sqrt(dx*dx + dy*dy);
                }
                lastPose = pose;
                
                let text = speed > 0.02 ? actionLabels[Math.floor(Date.now() / 500) % actionLabels.length] : normalLabels[0];
                drawSkeletalTracking(uiCtx, pose, 'rgba(255, 255, 255, 0.4)');
                drawLabel(uiCtx, text, (1 - pose[0].x) * width + 80, pose[0].y * height, '#fff');
            }

            // 阶段 3：误解 (荒诞错误)
            if (currentState === 'MISUNDERSTANDING') {
                drawSkeletalTracking(uiCtx, pose, 'rgba(255, 51, 102, 0.6)'); // 红色错误感
                if(Math.random() < 0.02) generateRandomLabels(); // 偶尔刷新
                currentRandomLabels.forEach(lbl => {
                    let node = pose[lbl.node];
                    if(node) {
                        drawLabel(uiCtx, lbl.text, (1 - node.x) * width, node.y * height, '#ff3366');
                    }
                });
            }

            // 阶段 4：数据化 (剥离物理特征)
            if (currentState === 'DATAFICATION') {
                // 在面部生成马赛克(Mask化)
                uiCtx.fillStyle = `rgba(255, 255, 255, ${dataficationProgress})`;
                for(let i=0; i<11; i++){
                    if(pose[i]) {
                        let px = (1 - pose[i].x) * width; let py = pose[i].y * height;
                        let size = Math.random() * 40 + 10;
                        uiCtx.fillRect(px - size/2, py - size/2, size, size);
                    }
                }
                // 绘制纯粹的冰冷骨架
                drawConnectors(uiCtx, pose, POSE_CONNECTIONS, {color: '#fff', lineWidth: 1});
            }
        }

        // 阶段 5：终局
        if (currentState === 'ENDING') {
            uiCanvas.style.opacity = 0; // 隐藏界面
            endingScreen.style.opacity = 1; // 浮现终极提问
        } else {
            uiCanvas.style.opacity = 1;
            endingScreen.style.opacity = 0;
        }
    }

    // 辅助绘图：绘制带有一定科幻感的标签
    function drawLabel(ctx, text, x, y, color, size=16) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.font = `${size}px sans-serif`;
        let m = ctx.measureText(text);
        
        ctx.beginPath();
        ctx.rect(x - m.width/2 - 10, y - 20, m.width + 20, 30);
        ctx.fill(); ctx.stroke();
        
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x, y - 5);
    }

    // 辅助绘图：绘制骨架 (需手动处理翻转映射)
    function drawSkeletalTracking(ctx, landmarks, color) {
        ctx.save();
        ctx.translate(width, 0); ctx.scale(-1, 1); // 翻转画布以匹配原生连线函数
        drawConnectors(ctx, landmarks, POSE_CONNECTIONS, {color: color, lineWidth: 2});
        drawLandmarks(ctx, landmarks, {color: color, radius: 2});
        ctx.restore();
    }

    // --- 初始化 MediaPipe ---
    const holistic = new Holistic({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
    }});
    
    holistic.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        refineFaceLandmarks: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });
    holistic.onResults(onResults);

    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await holistic.send({image: videoElement});
        },
        width: 1280,
        height: 720
    });
    camera.start();

</script>
</body>
</html>
