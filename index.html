<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Are You Without Labels?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #status-text {
            font-size: 1.2rem;
            letter-spacing: 2px;
            animation: blink 1s infinite;
        }

        #label-overlay {
            position: absolute;
            font-size: 1.5rem;
            font-weight: bold;
            background: #fff;
            color: #000;
            padding: 2px 10px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            opacity: 0;
        }

        /* 视频容器与滤镜 */
        #video-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 黑白、高对比度艺术滤镜 */
            filter: grayscale(100%) contrast(150%) brightness(80%);
            transition: opacity 2s ease;
            transform: scaleX(-1); /* 镜像 */
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 5;
        }

        /* 结尾字幕 */
        #ending-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 4s ease;
        }

        #ending-text {
            font-size: 2rem;
            letter-spacing: 5px;
            text-align: center;
            line-height: 2;
        }

        /* 初始启动按钮 */
        #start-btn {
            position: absolute;
            z-index: 50;
            padding: 15px 30px;
            border: 1px solid #fff;
            background: transparent;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        #start-btn:hover {
            background: #fff;
            color: #000;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <button id="start-btn">INITIATE SYSTEM</button>

    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="ui-layer">
        <div id="status-text">SYS.STANDBY</div>
        <div id="timeline-info" style="font-size: 0.8rem; opacity: 0.5;">T: 00:00:00</div>
    </div>
    
    <div id="label-overlay"></div>

    <div id="ending-screen">
        <div id="ending-text">— "Who are you without labels?" —</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');
        const labelOverlay = document.getElementById('label-overlay');
        const endingScreen = document.getElementById('ending-screen');
        const timelineInfo = document.getElementById('timeline-info');

        let detector;
        let startTime;
        let isRunning = false;
        let lastKeypoints = [];
        let state = 0; // 0: Recognition, 1: Classification, 2: Misunderstanding, 3: Datafication, 4: Ending

        // 荒谬标签库 (Misunderstanding 阶段)
        const absurdLabels = [
            "ABNORMAL MOVEMENT", "THREAT DETECTED", "UNAUTHORIZED BREATHING",
            "ROMANTICIZING DATA", "ATTEMPTING TO FLY?", "MALWARE BEHAVIOR",
            "SIMULATING EMOTION", "DEMONIC POSSESSION?", "ERROR 404: SOUL NOT FOUND",
            "GLITCH IN THE MATRIX", "CONSTRUCTING LIES", "BIOLOGICAL WASTE"
        ];

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 1280, height: 720 },
                audio: false
            });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    resolve(video);
                };
            });
        }

        async function init() {
            startBtn.style.display = 'none';
            statusText.innerText = "INITIALIZING NEURAL NET...";
            
            await setupCamera();
            video.play();
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            const detectorConfig = { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING };
            detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, detectorConfig);
            
            startTime = Date.now();
            isRunning = true;
            statusText.innerText = "ANALYZING...";
            
            detectPose();
        }

        function drawSkeleton(keypoints, isDatafication = false) {
            const adjacentKeyPoints = poseDetection.util.getAdjacentPairs(poseDetection.SupportedModels.MoveNet);
            
            if (isDatafication) {
                // 数据化阶段：像素化、骨骼化
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 5;
                ctx.fillStyle = '#000';
            } else {
                // 正常阶段：技术感细线
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = 1;
                ctx.fillStyle = '#fff';
            }

            adjacentKeyPoints.forEach(([i, j]) => {
                const kp1 = keypoints[i];
                const kp2 = keypoints[j];
                if (kp1.score > 0.3 && kp2.score > 0.3) {
                    ctx.beginPath();
                    ctx.moveTo(kp1.x, kp1.y);
                    ctx.lineTo(kp2.x, kp2.y);
                    ctx.stroke();
                }
            });

            keypoints.forEach(kp => {
                if (kp.score > 0.3) {
                    if (isDatafication) {
                        // 绘制遮罩化像素块
                        if (kp.name === 'nose' || kp.name.includes('eye')) {
                            ctx.fillStyle = '#fff';
                            ctx.fillRect(kp.x - 20, kp.y - 10, 40, 20); // Mask化面部
                            ctx.fillStyle = '#000';
                            ctx.font = '12px Courier';
                            ctx.fillText('NULL', kp.x - 15, kp.y + 5);
                        } else {
                            ctx.fillStyle = '#fff';
                            ctx.fillRect(kp.x - 5, kp.y - 5, 10, 10); // 像素化关节
                        }
                    } else {
                        // 正常节点
                        ctx.beginPath();
                        ctx.arc(kp.x, kp.y, 4, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                }
            });
        }

        function analyzeAction(keypoints) {
            // 获取特定关节点
            const nose = keypoints.find(k => k.name === 'nose');
            const leftWrist = keypoints.find(k => k.name === 'left_wrist');
            const rightWrist = keypoints.find(k => k.name === 'right_wrist');
            const leftShoulder = keypoints.find(k => k.name === 'left_shoulder');
            const rightShoulder = keypoints.find(k => k.name === 'right_shoulder');

            if (!nose || !leftWrist || !rightWrist || !leftShoulder || !rightShoulder) return;

            let motion = 0;
            if (lastKeypoints.length > 0) {
                motion = Math.abs(leftWrist.x - lastKeypoints.find(k=>k.name==='left_wrist').x) + 
                         Math.abs(rightWrist.x - lastKeypoints.find(k=>k.name==='right_wrist').x);
            }
            lastKeypoints = JSON.parse(JSON.stringify(keypoints));

            const shoulderDist = Math.abs(leftShoulder.x - rightShoulder.x);
            const handsUp = leftWrist.y < nose.y || rightWrist.y < nose.y;

            // 定位标签在用户头部上方 (需处理镜像坐标转换)
            const uiX = window.innerWidth - ((nose.x / video.videoWidth) * window.innerWidth);
            const uiY = (nose.y / video.videoHeight) * window.innerHeight - 80;
            
            labelOverlay.style.left = `${uiX}px`;
            labelOverlay.style.top = `${uiY}px`;
            labelOverlay.style.opacity = 1;

            if (state === 1) {
                // 分类 (Classification)
                if (shoulderDist > video.videoWidth * 0.4) {
                    labelOverlay.innerText = "WARNING: PROXIMITY ALERT";
                    labelOverlay.style.background = "#ff0000";
                    labelOverlay.style.color = "#fff";
                } else if (handsUp) {
                    labelOverlay.innerText = "EMOTION DETECTED: EXCITEMENT";
                    labelOverlay.style.background = "#fff";
                    labelOverlay.style.color = "#000";
                } else if (motion < 5) {
                    labelOverlay.innerText = "INACTIVE OBJECT";
                    labelOverlay.style.background = "#ccc";
                } else {
                    labelOverlay.innerText = "HUMAN BEHAVIOR: NORMAL";
                }
            } else if (state === 2) {
                // 误解 (Misunderstanding)
                // 随机抽取荒谬标签并增加闪烁
                if (Math.random() < 0.05) { 
                    const randomLabel = absurdLabels[Math.floor(Math.random() * absurdLabels.length)];
                    labelOverlay.innerText = randomLabel;
                    labelOverlay.style.background = Math.random() > 0.5 ? "#000" : "#fff";
                    labelOverlay.style.color = labelOverlay.style.background === "rgb(0, 0, 0)" ? "#fff" : "#000";
                    labelOverlay.style.border = "2px solid #fff";
                }
            } else {
                labelOverlay.style.opacity = 0;
            }
        }

        async function detectPose() {
            if (!isRunning) return;

            const poses = await detector.estimatePoses(video);
            const elapsed = (Date.now() - startTime) / 1000;
            timelineInfo.innerText = `SYS.UPTIME: ${elapsed.toFixed(2)}s | STAGE: 0${state}`;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 状态机时间轴管理 (叙事流程)
            if (elapsed < 5) {
                // 1. 识别
                state = 0;
                if(elapsed > 2) statusText.innerText = "HUMAN DETECTED";
            } else if (elapsed >= 5 && elapsed < 20) {
                // 2. 分类
                state = 1;
                statusText.innerText = "CLASSIFYING BEHAVIOR...";
            } else if (elapsed >= 20 && elapsed < 35) {
                // 3. 误解
                state = 2;
                statusText.innerText = "SYSTEM CONFLICT: SEMANTIC FAILURE";
            } else if (elapsed >= 35 && elapsed < 45) {
                // 4. 数据化
                state = 3;
                statusText.innerText = "DATAFICATION IN PROGRESS...";
                video.style.opacity = 0; // 褪去肉体质感(隐藏原视频)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; // 残影效果
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (elapsed >= 45) {
                // 5. 结尾
                state = 4;
                isRunning = false;
                endingScreen.style.opacity = 1; // 淡入结尾黑屏文字
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                labelOverlay.style.opacity = 0;
            }

            // 绘制逻辑
            if (poses.length > 0 && state < 4) {
                const keypoints = poses[0].keypoints;
                const isDatafication = (state === 3);
                drawSkeleton(keypoints, isDatafication);
                
                if (state === 1 || state === 2) {
                    analyzeAction(keypoints);
                }
                
                if (state === 0 && elapsed > 2) {
                    // Recognition阶段，画大检测框
                    const xs = keypoints.map(k => k.x);
                    const ys = keypoints.map(k => k.y);
                    const minX = Math.min(...xs) - 20;
                    const minY = Math.min(...ys) - 20;
                    const width = Math.max(...xs) - minX + 20;
                    const height = Math.max(...ys) - minY + 20;
                    
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(minX, minY, width, height);
                    ctx.font = '16px Courier';
                    ctx.fillStyle = '#fff';
                    ctx.fillText('TARGET_LOCKED', minX, minY - 10);
                }
            }

            requestAnimationFrame(detectPose);
        }

        startBtn.addEventListener('click', init);

    </script>
</body>
</html>
