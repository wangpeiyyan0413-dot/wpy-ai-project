<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Recognition</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        #container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #video {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #upload {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Teachable Machine Image Recognition</h1>
        <video id="video" playsinline autoplay></video>
        <button id="upload">Upload Image</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none;" />
        <div id="result"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/Image" async></script>
    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/YOUR_MODEL_URL/";
        let model, webcam, labelContainer;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            labelContainer = document.getElementById("result");
            webcam = new tmImage.Video(640, 480);
            await webcam.setup();
            await webcam.play();
            requestAnimationFrame(loop);
        }

        async function loop() {
            const predicted = await model.predict(webcam.capture());
            labelContainer.innerHTML = `Prediction: ${predicted[0].className} - Probability: ${predicted[0].probability.toFixed(2)}`;
            requestAnimationFrame(loop);
        }

        document.getElementById('upload').onclick = () => {
            document.getElementById('fileInput').click();
        };

        document.getElementById('fileInput').addEventListener('change', (event) => {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = async () => {
                    const prediction = await model.predict(tmImage.fromImage(img));
                    labelContainer.innerHTML = `Prediction: ${prediction[0].className} - Probability: ${prediction[0].probability.toFixed(2)}`;
                };
                document.body.appendChild(img);
            };
            reader.readAsDataURL(file);
        });

        window.onload = init;
    </script>
</body>
</html>
