<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Teachable Machine Model</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n            justify-content: center;\n            height: 100vh;\n            background-color: #f0f0f0;\n        }\n        #results {\n            margin-top: 20px;\n            font-size: 20px;\n        }\n        #video {\n            border: solid 2px #ccc;\n            width: 640px;\n            height: 480px;\n        }\n    </style>\n    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>\n    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>\n    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-automl"></script>\n</head>\n<body>\n    <h1>Teachable Machine Model</h1>\n    <video id="video" autoplay></video>\n    <button id="upload">Upload Image</button>\n    <input type="file" id="fileInput" style="display: none;" accept="image/*">\n    <div id="results"></div>\n    <script>\n        let model;\n        async function loadModel() {\n            model = await tf.loadLayersModel('https://teachablemachine.withgoogle.com/models/sTBoNGgmv/model.json');\n            document.getElementById('results').innerText = 'Model Loaded';\n        }\n        async function predict() {\n            const video = document.getElementById('video');\n            const predictions = await model.predict(tf.browser.fromPixels(video).resizeNearestNeighbor([224, 224]).expandDims(0));\n            // Process predictions here\n            document.getElementById('results').innerText = predictions;\n        }\n        document.getElementById('upload').onclick = () => {\n            document.getElementById('fileInput').click();\n        };\n        document.getElementById('fileInput').onchange = (event) => {\n            const file = event.target.files[0];\n            const reader = new FileReader();\n            reader.onload = (e) => {\n                const imgElement = document.createElement('img');\n                imgElement.src = e.target.result;\n                imgElement.onload = predict;\n            };\n            reader.readAsDataURL(file);\n        };\n        navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {\n            const video = document.getElementById('video');\n            video.srcObject = stream;\n            loadModel();\n        });\n    </script>\n</body>\n</html>
