<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who Are You Without Labels?</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }
    canvas {
      display: block;
    }
    /* 添加一个提示层，防止摄像头未加载时纯黑屏 */
    #loading-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="loading-text">REQUESTING CAMERA ACCESS...</div>

  <script>
    let video;
    let poseNet;
    let poses = [];
    let state = 0; 
    let stateStartTime;
    let motionLevel = 0;
    let prevNose = null;
    let currentMislabel = "ANALYZING...";
    let lastLabelChange = 0;
    let modelIsReady = false;

    const mislabels = [
      "ABNORMAL MOVEMENT", "THREAT DETECTED", "IRRATIONAL BIOMASS", 
      "UNDEFINED GESTURE", "MALFUNCTION IN SUBJECT", "EMOTION: FATAL ERROR",
      "NON-STANDARD BEHAVIOR", "MEAT_SACK_DETECTED"
    ];

    function setup() {
      createCanvas(windowWidth, windowHeight);
      
      // 初始化摄像头
      video = createCapture(VIDEO, function() {
        // 摄像头权限获取成功后，隐藏 HTML 提示文本
        document.getElementById('loading-text').style.display = 'none';
      });
      video.size(640, 480);
      video.hide();
      
      poseNet = ml5.poseNet(video, { flipHorizontal: true }, modelReady);
      poseNet.on('pose', function(results) {
        poses = results;
      });
      
      textFont('Courier New');
      stateStartTime = millis();
    }

    function modelReady() {
      console.log("Model Loaded Successfully");
      modelIsReady = true;
      stateStartTime = millis(); // 模型加载完毕后重新计时，确保阶段时间准确
    }

    function draw() {
      background(0);
      
      if (!modelIsReady) {
        // 模型未加载完时的缓冲动画
        fill(255);
        textAlign(CENTER, CENTER);
        textSize(24);
        text("INITIALIZING NEURAL NETWORK...", width / 2, height / 2 + 50);
        return; 
      }

      let elapsedTime = (millis() - stateStartTime) / 1000;
      
      calculateMotion();

      // 阶段控制
      if (elapsedTime < 5) state = 0;           
      else if (elapsedTime < 12) state = 1;      
      else if (elapsedTime < 25) state = 2;      
      else if (elapsedTime < 45) state = 3;      
      else if (elapsedTime < 60) state = 4;      
      else state = 5;                            

      // 画面居中与自适应缩放
      let vW = width;
      let vH = width * (480 / 640);
      if (vH < height) {
        vH = height;
        vW = height * (640 / 480);
      }
      let vX = (width - vW) / 2;
      let vY = (height - vH) / 2;

      // 阶段 0-3：视频与 UI
      if (state < 4) {
        push();
        translate(vX, vY);
        scale(vW / 640, vH / 480);
        
        drawingContext.filter = 'grayscale(100%) contrast(1.2) brightness(0.8)';
        push();
        translate(640, 0);
        scale(-1, 1);
        image(video, 0, 0, 640, 480);
        pop();
        drawingContext.filter = 'none';

        drawTrackingUI();
        
        if (poses.length > 0) {
          drawSkeleton();
          drawBoundingBox();
        }
        pop();
      }

      // 阶段 4：数据虚无化
      if (state === 4) {
        push();
        translate(vX, vY);
        scale(vW / 640, vH / 480);
        if (poses.length > 0) drawGlitchSkeleton();
        pop();
        
        fill(255, 50);
        noStroke();
        for(let i=0; i<100; i++){
          rect(random(width), random(height), random(5, 20), 2);
        }
      }

      drawLabels();
    }

    function drawLabels() {
      fill(255);
      noStroke();
      textAlign(CENTER, CENTER);

      if (state === 0) {
        textSize(32);
        text("[ ANALYZING... ]", width / 2, height - 50);
      } 
      else if (state === 1) {
        textSize(32);
        text("[ HUMAN DETECTED ]", width / 2, height - 50);
      } 
      else if (state === 2) {
        textSize(32);
        let label = "INACTIVE OBJECT";
        if (motionLevel > 15) label = "WARNING: UNSTABLE MOTION";
        if (poses.length > 0) {
          let pose = poses[0].pose;
          if (pose.leftWrist.y < pose.nose.y || pose.rightWrist.y < pose.nose.y) {
            label = "EMOTION DETECTED";
          }
          let eyeDist = dist(pose.leftEye.x, pose.leftEye.y, pose.rightEye.x, pose.rightEye.y);
          if (eyeDist > 100) label = "WARNING: DISTANCE TOO CLOSE";
        }
        text(`[ ${label} ]`, width / 2, height - 50);
      } 
      else if (state === 3) {
        textSize(40);
        if (millis() - lastLabelChange > 1500) { 
          currentMislabel = random(mislabels);
          lastLabelChange = millis();
        }
        if (motionLevel > 5) fill(255, 0, 0); 
        text(`[ ${currentMislabel} ]`, width / 2, height - 50);
      }
      else if (state === 5) {
        background(0); 
        fill(255);
        textSize(48);
        text("Who are you without labels?", width / 2, height / 2);
      }
    }

    function calculateMotion() {
      if (poses.length > 0) {
        let nose = poses[0].pose.nose;
        if (prevNose) {
          let d = dist(nose.x, nose.y, prevNose.x, prevNose.y);
          motionLevel = lerp(motionLevel, d, 0.1);
        }
        prevNose = { x: nose.x, y: nose.y };
      } else {
        motionLevel = lerp(motionLevel, 0, 0.1);
      }
    }

    function drawTrackingUI() {
      stroke(255, 50);
      strokeWeight(1);
      line(0, 240, 640, 240);
      line(320, 0, 320, 480);
      noFill();
      ellipse(320, 240, 200, 200);
    }

    function drawSkeleton() {
      let pose = poses[0].pose;
      let skeleton = poses[0].skeleton;
      stroke(255);
      strokeWeight(2);
      for (let j = 0; j < skeleton.length; j++) {
        let partA = skeleton[j][0];
        let partB = skeleton[j][1];
        line(partA.position.x, partA.position.y, partB.position.x, partB.position.y);
      }
      noStroke();
      fill(255);
      for (let i = 0; i < pose.keypoints.length; i++) {
        let x = pose.keypoints[i].position.x;
        let y = pose.keypoints[i].position.y;
        rectMode(CENTER);
        rect(x, y, 6, 6);
      }
    }

    function drawGlitchSkeleton() {
      let pose = poses[0].pose;
      let skeleton = poses[0].skeleton;
      stroke(255);
      strokeWeight(4);
      for (let j = 0; j < skeleton.length; j++) {
        let partA = skeleton[j][0];
        let partB = skeleton[j][1];
        let ox = random(-5, 5); 
        line(partA.position.x + ox, partA.position.y, partB.position.x - ox, partB.position.y);
      }
      noStroke();
      fill(255);
      for (let i = 0; i < pose.keypoints.length; i++) {
        let x = pose.keypoints[i].position.x;
        let y = pose.keypoints[i].position.y;
        rect(x, y, random(10, 25), random(10, 25)); 
      }
      fill(0);
      stroke(255);
      strokeWeight(2);
      rect(pose.nose.x, pose.nose.y, 80, 100); 
    }

    function drawBoundingBox() {
      let pose = poses[0].pose;
      let minX = 640, minY = 480, maxX = 0, maxY = 0;
      for (let i = 0; i < pose.keypoints.length; i++) {
        if (pose.keypoints[i].score > 0.2) {
          let x = pose.keypoints[i].position.x;
          let y = pose.keypoints[i].position.y;
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
      }
      stroke(255, 150);
      strokeWeight(1);
      noFill();
      rectMode(CORNER);
      rect(minX - 20, minY - 20, (maxX - minX) + 40, (maxY - minY) + 40);
      fill(255, 150);
      noStroke();
      textAlign(LEFT, BOTTOM);
      textSize(12);
      text("OBJ_HUMAN_01", minX - 20, minY - 25);
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
