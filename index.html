<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who Are You Without Labels?</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  
  <style>
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #050505; /* 极暗的深灰，比纯黑更有屏幕质感 */
      color: #fff;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }
    canvas { display: block; }
    
    #loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      letter-spacing: 4px;
      pointer-events: none;
      animation: blink 1s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="loading">SYSTEM INITIALIZING... [CAMERA REQ]</div>

  <script>
    let video;
    let poseNet;
    let poses = [];
    
    // 时间与状态控制
    let currentState = 1; 
    let stateStartTime = 0;
    
    // 荒谬标签库
    const absurdLabels = [
      "ABNORMAL MOVEMENT", 
      "THREAT DETECTED: HUG", 
      "ORIENTATION: HOMOSEXUAL", 
      "ERROR: EMOTION OVERFLOW",
      "SUBJECT: MEANINGLESS"
    ];

    function setup() {
      createCanvas(windowWidth, windowHeight);
      
      // 1. 初始化摄像头
      video = createCapture(VIDEO, function() {
        document.getElementById('loading').style.display = 'none';
        stateStartTime = millis(); // 摄像头就绪后开始计时
      });
      video.size(windowWidth, windowHeight);
      video.hide(); 

      // 2. 初始化姿态识别 (开启左右翻转，契合人类照镜子的直觉)
      let options = { flipHorizontal: true };
      poseNet = ml5.poseNet(video, options, modelReady);
      poseNet.on('pose', function(results) {
        poses = results;
      });
      
      textFont('Courier New');
    }

    function modelReady() {
      console.log('CV Model Loaded.');
    }

    function draw() {
      background(5);
      
      // 3. 渲染摄像头画面 (必须翻动画布来配合 flipHorizontal)
      push();
      translate(width, 0);
      scale(-1, 1);
      tint(255, 90); // 极度降低真实画面的透明度，呈现冷酷感
      image(video, 0, 0, width, height);
      pop();

      // 全局黑白与色阶滤镜
      filter(GRAY);
      filter(POSTERIZE, 4);

      // 4. 核心状态机逻辑 (基于 millis 真实时间)
      let elapsedTime = millis() - stateStartTime;

      if (poses.length > 0) {
        let pose = poses[0].pose;
        let skeleton = poses[0].skeleton;
        runArtLogic(pose, skeleton, elapsedTime);
      } else {
        // 无人状态：重置时间，显示等待
        drawText("AWAITING SUBJECT...", width / 2, height / 2, true);
        stateStartTime = millis();
        currentState = 1;
      }
    }

    // --- 艺术表达核心逻辑 ---
    function runArtLogic(pose, skeleton, time) {
      
      // 阶段 1：识别 (0 - 5秒)
      if (time < 5000) {
        currentState = 1;
        drawTrackingUI(pose);
        drawText("> HUMAN DETECTED", pose.nose.x + 60, pose.nose.y - 40);
        drawText("ANALYZING BIOMETRICS...", width / 2, 50, true);
      } 
      
      // 阶段 2：分类 (5 - 12秒)
      else if (time >= 5000 && time < 12000) {
        currentState = 2;
        drawTrackingUI(pose);
        drawSkeleton(skeleton, false);
        
        let handsUp = pose.leftWrist.y < pose.nose.y && pose.rightWrist.y < pose.nose.y;
        let armsWide = dist(pose.leftWrist.x, pose.leftWrist.y, pose.rightWrist.x, pose.rightWrist.y) > width * 0.4;
        
        if (handsUp) {
          drawText("[EMOTION DETECTED: SURRENDER]", pose.nose.x, pose.nose.y - 90);
        } else if (armsWide) {
          drawText("[WARNING: AGGRESSIVE EXPANSION]", pose.nose.x, pose.nose.y - 90);
        } else {
          drawText("[INACTIVE OBJECT / DOCILE]", pose.nose.x, pose.nose.y - 90);
        }
      }
      
      // 阶段 3：误解与故障 (12 - 20秒)
      else if (time >= 12000 && time < 20000) {
        currentState = 3;
        applyGlitchEffect(); // 触发画面撕裂
        drawSkeleton(skeleton, true); // 骨骼疯狂抖动
        
        // 每 0.8 秒切换一次荒谬标签
        let labelIndex = floor(time / 800) % absurdLabels.length;
        drawText("!!" + absurdLabels[labelIndex] + "!!", pose.nose.x + random(-20, 20), pose.nose.y - 120 + random(-10, 10));
        
        // 随机在屏幕上打印乱码
        if (random() > 0.8) drawText("SEGMENTATION_FAULT_0x" + hex(floor(random(10000))), random(width), random(height));
      }
      
      // 阶段 4：数据化与剥离 (20 - 28秒)
      else if (time >= 20000 && time < 28000) {
        currentState = 4;
        background(0); // 彻底吞噬真实肉身画面
        
        // 计算数据化程度
        let progress = map(time, 20000, 28000, 0, 1);
        drawDataMask(pose, progress);
        
        drawText("USER_ID: NULL", width / 2, 50, true);
        drawText("IDENTITY_STRIPPED", width / 2, height - 50, true);
      }
      
      // 阶段 5：灵魂拷问 (28 - 36秒)
      else if (time >= 28000 && time < 36000) {
        currentState = 5;
        background(0);
        
        textSize(32);
        textAlign(CENTER, CENTER);
        fill(255);
        text("Who are you without labels?", width / 2, height / 2);
      }
      
      // 循环重置 (36秒后)
      else if (time >= 36000) {
        stateStartTime = millis(); // 重新开始这一轮
      }
    }


    // --- 视觉绘制辅助函数 ---

    function drawTrackingUI(pose) {
      stroke(255);
      strokeWeight(1);
      noFill();
      let s = 100;
      // 脸部方框
      rect(pose.nose.x - s/2, pose.nose.y - s/2, s, s);
      // 准星
      line(pose.nose.x - 10, pose.nose.y, pose.nose.x + 10, pose.nose.y);
      line(pose.nose.x, pose.nose.y - 10, pose.nose.x, pose.nose.y + 10);
    }

    function drawSkeleton(skeleton, isGlitch) {
      stroke(255);
      strokeWeight(1);
      for (let i = 0; i < skeleton.length; i++) {
        let p1 = skeleton[i][0];
        let p2 = skeleton[i][1];
        let offset = isGlitch ? random(-3
