<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Are You Without Labels?</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        /* 容器与画布 */
        #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        video { display: none; } /* 隐藏原生视频，使用canvas绘制 */
        canvas { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1); /* 镜像翻转，符合直觉 */
            transition: opacity 2s ease;
        }

        /* UI 叠加层 */
        #ui-layer { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        /* 状态与指令文本 */
        #status-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            letter-spacing: 4px;
            font-weight: 300;
            text-align: center;
            transition: opacity 1s ease;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* 标签样式 */
        .label {
            position: absolute;
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ffcc;
            padding: 4px 10px;
            font-size: 14px;
            font-weight: bold;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
            opacity: 0.9;
            box-shadow: 0 0 8px rgba(0,255,204,0.4);
            white-space: nowrap;
        }

        .label.misunderstand {
            color: #ff3366;
            border-color: #ff3366;
            box-shadow: 0 0 10px rgba(255,51,102,0.6);
            font-size: 16px;
            animation: glitch 0.2s infinite;
        }

        /* 结尾哲思提问 */
        #ending-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            z-index: 20;
            transition: opacity 3s ease;
            pointer-events: none;
        }
        #ending-screen h1 { font-size: 32px; font-weight: 300; letter-spacing: 2px; margin-bottom: 20px; }
        #ending-screen p { font-size: 18px; color: #888; letter-spacing: 4px; }

        @keyframes glitch {
            0% { transform: translate(-50%, -50%) skew(0deg); }
            20% { transform: translate(-52%, -50%) skew(-10deg); }
            40% { transform: translate(-48%, -50%) skew(10deg); }
            60% { transform: translate(-50%, -52%) skew(0deg); }
            80% { transform: translate(-50%, -48%) skew(0deg); }
            100% { transform: translate(-50%, -50%) skew(0deg); }
        }
    </style>
</head>
<body>

<div id="container">
    <video id="videoElement" autoplay playsinline></video>
    <canvas id="canvasElement"></canvas>
    
    <div id="ui-layer">
        <div id="status-text">ANALYZING...<br><span style="font-size:14px; color:#aaa;">(分析中……)</span></div>
        <div id="labels-container"></div>
    </div>

    <div id="ending-screen">
        <h1>褪去标签，你究竟是谁？</h1>
        <p>Who are you without labels?</p>
    </div>
</div>

<script>
    const videoElement = document.getElementById('videoElement');
    const canvasElement = document.getElementById('canvasElement');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status-text');
    const labelsContainer = document.getElementById('labels-container');
    const endingScreen = document.getElementById('ending-screen');

    // 交互状态与时间轴配置
    let interactionStartTime = null;
    let currentState = 'recognition'; 
    let lastLandmarks = null;
    let labelUpdateTimer = 0;

    // 各种阶段的标签库
    const normalLabels = ["姿态：静止", "动作：舒展", "行为：观察", "空间：占据", "状态：活动中"];
    const actionLabels = ["动作：挥舞", "动作：移动", "动作：试图打破边界", "姿态：防御"];
    const absurdLabels = [
        "系统错误：未熟透的碳基生物", 
        "野生奥特曼检测中", 
        "试图起飞的打字机", 
        "卡顿的NPC", 
        "正在下载灵魂 (Error 404)", 
        "人类早期驯服四肢珍贵影像", 
        "无效的求偶舞蹈",
        "一棵情绪不稳定的树",
        "警告：企图逃离三维空间"
    ];

    function resizeCanvas() {
        canvasElement.width = window.innerWidth;
        canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 状态机管理器
    function updateStateMachine(landmarks) {
        if (!interactionStartTime) {
            interactionStartTime = Date.now();
            statusText.innerHTML = "HUMAN DETECTED<br><span style='font-size:14px; color:#00ffcc;'>[ 检测到人类 ]</span>";
            setTimeout(() => statusText.style.opacity = 0, 2500);
        }

        let elapsed = (Date.now() - interactionStartTime) / 1000;

        if (elapsed < 3) {
            currentState = 'recognition';
        } else if (elapsed >= 3 && elapsed < 12) {
            currentState = 'classification';
        } else if (elapsed >= 12 && elapsed < 22) {
            currentState = 'misunderstanding';
        } else if (elapsed >= 22 && elapsed < 32) {
            currentState = 'datafication';
        } else if (elapsed >= 32) {
            currentState = 'ending';
        }

        updateLabels(landmarks, elapsed);
    }

    // 动态生成和更新标签
    function updateLabels(landmarks, elapsed) {
        labelUpdateTimer++;
        // 每隔一段时间更新一次标签，避免闪烁过快
        if (labelUpdateTimer % 15 !== 0) return;

        labelsContainer.innerHTML = ''; // 清除旧标签

        if (currentState === 'classification') {
            // 计算动作幅度判定动/静
            let isMoving = false;
            if (lastLandmarks) {
                let diff = Math.abs(landmarks[0].x - lastLandmarks[0].x) + Math.abs(landmarks[0].y - lastLandmarks[0].y);
                if (diff > 0.02) isMoving = true;
            }
            lastLandmarks = landmarks;

            let text = isMoving ? actionLabels[Math.floor(Math.random() * actionLabels.length)] : normalLabels[Math.floor(Math.random() * normalLabels.length)];
            createDOMText(text, landmarks[0].x, landmarks[0].y - 0.1, 'label');
        } 
        else if (currentState === 'misunderstanding') {
            // 误解阶段：随机在身体多个节点贴荒诞标签
            for (let i = 0; i < 3; i++) {
                let randomNode = landmarks[Math.floor(Math.random() * 20)];
                let text = absurdLabels[Math.floor(Math.random() * absurdLabels.length)];
                createDOMText(text, randomNode.x, randomNode.y, 'label misunderstand');
            }
        }
        else if (currentState === 'datafication' || currentState === 'ending') {
            // 清除所有DOM标签
            labelsContainer.innerHTML = '';
        }
    }

    // 创建 DOM 标签元素
    function createDOMText(text, x, y, className) {
        const el = document.createElement('div');
        el.className = className;
        el.innerText = text;
        // 因为 canvas 是水平翻转的 (scaleX(-1))，DOM坐标需要反转 X 轴对齐
        el.style.left = `${(1 - x) * 100}%`; 
        el.style.top = `${y * 100}%`;
        labelsContainer.appendChild(el);
    }

    // 核心绘制逻辑
    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        // 阶段 4：数据化 (抹除真实的肉体)
        if (currentState === 'datafication') {
            // 绘制半透明黑色背景，逐渐覆盖原生画面，产生拖影和消亡感
            canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        } else if (currentState !== 'ending') {
            // 正常阶段绘制视频源
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        }

        // 检测到人体特征
        if (results.poseLandmarks && currentState !== 'ending') {
            updateStateMachine(results.poseLandmarks);

            // 绘制骨架和点
            if (currentState === 'datafication') {
                // 数据化阶段：像素化、骨骼化
                drawDataficationBones(results.poseLandmarks);
            } else {
                // 正常识别阶段：科幻UI风
                drawTechUIBones(results.poseLandmarks);
            }
        }

        // 阶段 5：结尾
        if (currentState === 'ending') {
            canvasCtx.fillStyle = '#000';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
            endingScreen.style.opacity = 1;
        }

        canvasCtx.restore();
    }

    // 绘制高级科技感的骨骼UI（前三个阶段）
    function drawTechUIBones(landmarks) {
        // 绘制骨架连接线
        drawConnectors(canvasCtx, landmarks, POSE_CONNECTIONS, {color: '#00ffcc', lineWidth: 2});
        // 绘制关节点
        drawLandmarks(canvasCtx, landmarks, {color: '#ffffff', fillColor: '#ff3366', lineWidth: 2, radius: 4});
        
        // 计算并绘制检测框 (Bounding Box)
        let minX = 1, minY = 1, maxX = 0, maxY = 0;
        landmarks.forEach(lm => {
            if (lm.x < minX) minX = lm.x;
            if (lm.y < minY) minY = lm.y;
            if (lm.x > maxX) maxX = lm.x;
            if (lm.y > maxY) maxY = lm.y;
        });

        const w = canvasElement.width;
        const h = canvasElement.height;
        const x = minX * w; const y = minY * h;
        const rectW = (maxX - minX) * w; const rectH = (maxY - minY) * h;

        canvasCtx.strokeStyle = 'rgba(0, 255, 204, 0.6)';
        canvasCtx.lineWidth = 1;
        canvasCtx.strokeRect(x, y, rectW, rectH);

        // 绘制角落装饰线 (增添AI系统视觉感)
        const cornerLen = 20;
        canvasCtx.beginPath();
        canvasCtx.moveTo(x, y + cornerLen); canvasCtx.lineTo(x, y); canvasCtx.lineTo(x + cornerLen, y); // 左上
        canvasCtx.moveTo(x + rectW, y + cornerLen); canvasCtx.lineTo(x + rectW, y); canvasCtx.lineTo(x + rectW - cornerLen, y); // 右上
        canvasCtx.moveTo(x, y + rectH - cornerLen); canvasCtx.lineTo(x, y + rectH); canvasCtx.lineTo(x + cornerLen, y + rectH); // 左下
        canvasCtx.moveTo(x + rectW, y + rectH - cornerLen); canvasCtx.lineTo(x + rectW, y + rectH); canvasCtx.lineTo(x + rectW - cornerLen, y + rectH); // 右下
        canvasCtx.strokeStyle = '#00ffcc';
        canvasCtx.lineWidth = 3;
        canvasCtx.stroke();
    }

    // 绘制数据化阶段的抽象骨骼（Phase 4）
    function drawDataficationBones(landmarks) {
        // 使用纯白和随机噪点线代替原来的追踪 UI，制造剥离感
        drawConnectors(canvasCtx, landmarks, POSE_CONNECTIONS, {color: '#ffffff', lineWidth: 1});
        
        const w = canvasElement.width;
        const h = canvasElement.height;

        // 在面部/身体周围绘制混乱的像素块(Mask化)
        canvasCtx.fillStyle = '#ffffff';
        landmarks.forEach((lm, index) => {
            if(index < 11) { // 头部节点
                let size = Math.random() * 30 + 10;
                canvasCtx.fillRect(lm.x * w - size/2, lm.y * h - size/2, size, size);
            } else {
                if(Math.random() > 0.5) {
                    canvasCtx.fillRect(lm.x * w, lm.y * h, 5, 5);
                }
            }
        });
    }

    // 初始化 MediaPipe Pose
    const pose = new Pose({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }});

    pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    // 启动摄像头
    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await pose.send({image: videoElement});
        },
        width: 1280,
        height: 720
    });
    camera.start();

</script>
</body>
</html>
